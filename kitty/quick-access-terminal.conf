# Terminal d'acces rapide (kitten quick-access-terminal) : descend du haut de l'ecran.
# Ouvert/masque par le raccourci global pose par install.sh (Super+`), avec btop.
lines 28
edge top
background_opacity 0.95
hide_on_focus_loss yes
# btop demande au moins 80x24 : pas de barre d'onglets ici
kitty_override tab_bar_min_tabs=2
