# Reglages kitty du poste, inclus par ~/.config/kitty/kitty.conf (include poste.conf)

#: Confort et apparence {{{

# Police
font_family      family="JetBrains Mono"
font_size        11.5

# Fenetre sans barre de titre ni bordure (deplacer : Alt + glisser)
# Onglets : Ctrl+Tab suivant, Ctrl+Shift+T nouveau, Ctrl+Shift+Q fermer
# Liste de tous les raccourcis : Ctrl+Shift+F3 (palette de commandes)
hide_window_decorations yes
window_padding_width    4

# Noir integral
background              #000000
tab_bar_background      #000000
active_tab_background   #1c1c1c
active_tab_foreground   #ffffff
inactive_tab_background #000000
inactive_tab_foreground #6c6c6c
selection_background    #3a3a3a
# le texte selectionne garde sa propre couleur
selection_foreground    none

# Onglets en haut, style powerline, barre toujours visible ; a droite, l'etat
# du poste en couleurs (tab_bar.py : onglets powerline de kitty + etat)
tab_bar_edge        top
tab_bar_style       custom
tab_powerline_style slanted
tab_bar_min_tabs    1

# Navigation entre onglets (memes touches que gnome-terminal)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map ctrl+page_down next_tab
map ctrl+page_up   previous_tab

# Explorateur yazi en panneau a gauche, dans le dossier de l'onglet courant
# (q pour fermer ; taille : glisser la bordure, elle reste en pourcentage)
map ctrl+shift+y launch --type=window-dock --dock-edge=left --dock-size=40% --cwd=current yazi

# Pages web dans le terminal : Chrome (ton profil) en panneau a droite ; Ctrl+Q pour fermer
# Ctrl+Shift+Alt+E : choisir un lien a l'ecran et l'ouvrir dans ce Chrome
# (Ctrl+Shift+E l'ouvre toujours dans le navigateur habituel)
map ctrl+shift+alt+e kitten hints --type url --program "launch --type=window-dock --dock-edge=right --dock-size=50% poste-chrome"
# Ctrl+Shift+Alt+W : Chrome dans le panneau, sur la saisie d'adresse
map ctrl+shift+alt+w launch --type=window-dock --dock-edge=right --dock-size=50% poste-chrome

# Confort
scrollback_lines      10000
# la souris disparait des que tu tapes
mouse_hide_wait       -1
enable_audio_bell     no
# pas d'espaces parasites en fin de ligne dans le texte copie
strip_trailing_spaces smart
# notification quand une commande de plus de 15 s finit dans un onglet cache
notify_on_cmd_finish  invisible 15.0

# Trainee animee du curseur (seulement sur un saut d'au moins 2 cases
# apres 200 ms d'immobilite, pas en tapant)
cursor_trail                 200
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

#: }}}

#: Restauration des terminaux apres redemarrage {{{

# Arret propre (menu) : kitty enregistre tout, texte affiche compris,
# et le restaure au demarrage suivant (prioritaire sur startup_session)
restore_session_after_logout yes

# Extinction forcee ou plantage : repli sur la sauvegarde continue
startup_session ${HOME}/.local/state/kitty-autosave/session.kitty-session

# Sauvegarde continue + suivi des sessions Claude de chaque onglet
watcher autosave.py
# F11 du navigateur du terminal : fenetre kitty sans barre, plein ecran, navigateur seul
watcher immersion.py

#: }}}
